apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-nginx
  namespace: default
spec:
  destination:
    name: in-cluster
    namespace: nginx-test
  project: default
  source:
    directory:
      recurse: true
    path: nginx_yaml_files
    repoURL: https://github.com/santhoshkumarasamy/argo-cd-00
    targetRevision: main
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true