apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: default
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      parameters:
      - name: crds.enabled
        value: "true"
    path: helm-installation/cert-manager
    repoURL: https://github.com/santhoshkumarasamy/argo-cd-00
    targetRevision: main