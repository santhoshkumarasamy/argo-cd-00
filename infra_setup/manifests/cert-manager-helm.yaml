apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: default
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: cert-manager
    helm:
      parameters:
      - name: crds.enabled
        value: "true"
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.1
  syncPolicy:
    syncOptions:
    - CreateNamespace=true